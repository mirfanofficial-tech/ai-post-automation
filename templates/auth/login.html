{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Postly</title>

  <!-- Bootstrap 5.3 CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <style>
    html, body {
      height: 100%;
    }
    body {
      background-color: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      border: none;
      border-radius: .6rem;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .login-brand {
      color: #1e2a38;
      font-weight: 700;
      font-size: 1.35rem;
    }
    .login-brand span {
      color: #4e9af1;
    }
  </style>
</head>
<body>

  <div class="login-card card p-4 p-sm-5">

    <!-- Brand -->
    <div class="text-center mb-4">
      <div class="mb-3">
        <img src="{% static 'images/logo.png' %}" alt="Postly" style="height: 48px;">
      </div>
      <div class="login-brand mb-1">
        Post<span>ly</span>
      </div>
      <p class="text-muted mb-0" style="font-size:.875rem;">Sign in to your account</p>
    </div>

    <!-- Error alert -->
    {% if error %}
    <div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
      <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
      <span style="font-size:.875rem;">{{ error }}</span>
    </div>
    {% endif %}

    <!-- Login form -->
    <form method="post" novalidate>
      {% csrf_token %}

      <!-- Preserve ?next= so Django can redirect after login -->
      {% if next %}
        <input type="hidden" name="next" value="{{ next }}" />
      {% endif %}

      <div class="mb-3">
        <label for="id_username" class="form-label fw-medium" style="font-size:.875rem;">
          Username or Email
        </label>
        <div class="input-group">
          <span class="input-group-text bg-white">
            <i class="bi bi-person text-muted"></i>
          </span>
          <input
            type="text"
            id="id_username"
            name="username"
            class="form-control{% if error %} is-invalid{% endif %}"
            value="{{ username }}"
            placeholder="Enter username or email"
            autocomplete="username"
            autofocus
            required
          />
        </div>
      </div>

      <div class="mb-4">
        <label for="id_password" class="form-label fw-medium" style="font-size:.875rem;">
          Password
        </label>
        <div class="input-group">
          <span class="input-group-text bg-white">
            <i class="bi bi-lock text-muted"></i>
          </span>
          <input
            type="password"
            id="id_password"
            name="password"
            class="form-control{% if error %} is-invalid{% endif %}"
            autocomplete="current-password"
            required
          />
        </div>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
      </div>

    </form>

  </div><!-- /.login-card -->

  <!-- Bootstrap 5.3 JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmhD0Ob0ZMgv0BpgXD8HNa8CIFe"
    crossorigin="anonymous"
  ></script>

</body>
</html>
