{% extends "posts/base_posts.html" %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh] text-center px-4">

  <div class="w-20 h-20 rounded-2xl bg-red-50 border border-red-200 flex items-center justify-center mb-5">
    <i data-lucide="shield-x" class="w-10 h-10 text-red-400"></i>
  </div>

  <h1 class="text-2xl font-bold text-slate-800 mb-2">Access Denied</h1>
  <p class="text-sm text-slate-500 max-w-sm mb-6">
    You don't have permission to do this. Contact your administrator
    if you think this is a mistake.
  </p>

  <div class="flex items-center gap-3">
    <a href="{% url 'posts:post_list' %}"
       class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-violet-600 hover:bg-violet-700 text-white text-sm font-medium transition">
      <i data-lucide="layout-list" class="w-4 h-4"></i>
      Back to Posts
    </a>
    <button onclick="history.back()"
            class="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm font-medium transition">
      Go Back
    </button>
  </div>

</div>
{% endblock %}
