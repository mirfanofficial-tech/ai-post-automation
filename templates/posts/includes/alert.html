{# Reusable flash alert. Usage: {% include "posts/includes/alert.html" with msg=message %} #}

<div class="flash-msg flex items-start gap-3 rounded-xl px-4 py-3 text-sm
  {% if msg.tags == 'success' %}bg-emerald-50 border border-emerald-200 text-emerald-800
  {% elif msg.tags == 'error' or msg.tags == 'danger' %}bg-red-50 border border-red-200 text-red-800
  {% elif msg.tags == 'warning' %}bg-amber-50 border border-amber-200 text-amber-800
  {% else %}bg-sky-50 border border-sky-200 text-sky-800{% endif %}">

  <span class="flex-shrink-0 mt-0.5">
    {% if msg.tags == 'success' %}<i data-lucide="check-circle" class="w-4 h-4 text-emerald-500"></i>
    {% elif msg.tags == 'error' or msg.tags == 'danger' %}<i data-lucide="x-circle" class="w-4 h-4 text-red-500"></i>
    {% elif msg.tags == 'warning' %}<i data-lucide="alert-triangle" class="w-4 h-4 text-amber-500"></i>
    {% else %}<i data-lucide="info" class="w-4 h-4 text-sky-500"></i>{% endif %}
  </span>

  <span class="flex-1">{{ msg }}</span>

  <button onclick="this.parentElement.remove()" class="flex-shrink-0 opacity-50 hover:opacity-100 transition ml-2">
    <i data-lucide="x" class="w-3.5 h-3.5"></i>
  </button>
</div>
